name: Welcome new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            👋 Thank you for opening your first issue in JustBuntu! We appreciate you taking
            the time to report this. Please make sure you've included your Ubuntu version,
            architecture, and any relevant log output. A maintainer will review this shortly.
          pr-message: >
            🎉 Thank you for your first contribution to JustBuntu! Please make sure your
            changes pass all CI checks. A maintainer will review your pull request shortly.
