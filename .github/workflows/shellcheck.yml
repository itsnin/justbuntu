name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['**/*.sh']
  pull_request:
    branches: [main]
    paths: ['**/*.sh']

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
          severity: style
