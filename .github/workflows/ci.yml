name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all shell scripts pass syntax validation
        run: |
          find . -name "*.sh" -exec bash -n {} \;
          echo "All shell scripts pass syntax validation"

      - name: Check no forbidden project references
        run: |
          # build patterns at runtime to avoid literal matches in this file
          A1='om' && B1='akub' && P1="$A1$B1"
          A2='base' && B2='camp' && P2="$A2$B2"
          A3='37' && B3='signals' && P3="$A3$B3"
          A4='dh' && B4='h' && P4="$A4$B4"
          A5='hey' && B5='.com' && P5="$A5$B5"
          PATTERN="$P1\|$P2\|$P3\|$P4\|$P5"
          if grep -rniI "$PATTERN" . --include="*.sh" --include="*.md" --include="*.txt" --include="*.yml" --exclude-dir=.git; then
            echo "ERROR: found forbidden project references"
            exit 1
          fi
          echo "No forbidden references found"

      - name: Check version file exists and is non-empty
        run: |
          if [ ! -s version ]; then
            echo "ERROR: version file is missing or empty"
            exit 1
          fi
          echo "Version: $(cat version)"

      - name: Check README has MIT license link
        run: |
          if ! grep -qi "MIT" README.md; then
            echo "ERROR: README does not reference MIT license"
            exit 1
          fi
          echo "README references MIT license"

      - name: Verify LICENSE file exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file is missing"
            exit 1
          fi
          echo "LICENSE file exists"

      - name: Summary
        run: |
          echo "=== CI Summary ==="
          echo "Shell scripts: $(find . -name "*.sh" | wc -l)"
          echo "Total files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "All checks passed"
