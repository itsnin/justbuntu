name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check all shell scripts pass syntax validation
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n
          echo "All shell scripts pass syntax validation"

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error \
            $(find . -type f -name '*.sh' -not -path './.git/*' -print)

      - name: Run logging and reporting smoke checks
        run: |
          set -euo pipefail
          ROOT_DIR="$GITHUB_WORKSPACE"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$CHECK_DIR"' EXIT

          fail() {
            printf 'FAIL: %s\n' "$1" >&2
            exit 1
          }

          assert_contains() {
            grep -F -- "$2" "$1" >/dev/null || fail "expected '$2' in $1"
          }

          assert_not_contains() {
            if grep -F -- "$2" "$1" >/dev/null; then
              fail "did not expect '$2' in $1"
            fi
          }

          export HOME="$CHECK_DIR/home"
          export XDG_STATE_HOME="$CHECK_DIR/state"
          export JUSTBUNTU_INSTALL_LOG_FILE="$CHECK_DIR/state/justbuntu/install.log"
          mkdir -p -- "$HOME"
          source "$ROOT_DIR/lib/logging.sh"
          source "$ROOT_DIR/lib/reporting.sh"

          start_install_log
          log_info 'token=do-not-write-this password=also-private'
          FIXTURE="$CHECK_DIR/ok.sh"
          printf '#!/bin/bash\nlog_info "fixture completed"\n' >"$FIXTURE"
          run_script "$FIXTURE"
          sleep 0.1
          finish_install_log completed

          [[ "$(stat -c '%a' "$JUSTBUNTU_INSTALL_LOG_FILE")" == '600' ]] ||
            fail 'install log is not private'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" '[REDACTED]'
          assert_not_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'do-not-write-this'
          assert_not_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'also-private'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'event=script_start'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'event=script_complete'

          JUSTBUNTU_PHASE='test'
          CURRENT_SCRIPT_PATH="$FIXTURE"
          JUSTBUNTU_ERROR_FUNCTION='test_failure'
          JUSTBUNTU_ERROR_LINE='42'
          JUSTBUNTU_ERROR_CODE='1'
          JUSTBUNTU_ERROR_COMMAND='curl Authorization: Bearer do-not-write-this'
          create_failure_report
          [[ "$(stat -c '%a' "$JUSTBUNTU_LAST_REPORT_FILE")" == '600' ]] ||
            fail 'failure report is not private'
          assert_contains "$JUSTBUNTU_LAST_REPORT_FILE" 'JustBuntu installation failure'
          assert_contains "$JUSTBUNTU_LAST_REPORT_FILE" '[REDACTED]'
          assert_not_contains "$JUSTBUNTU_LAST_REPORT_FILE" 'do-not-write-this'

          if send_failure_report "$JUSTBUNTU_LAST_REPORT_FILE" ''; then
            fail 'empty token unexpectedly submitted a report'
          elif [[ "$?" != '3' ]]; then
            fail 'empty token did not use the local-report fallback'
          fi

          MOCK_BIN="$CHECK_DIR/bin"
          mkdir -p -- "$MOCK_BIN"
          MOCK_CAPTURE="$CHECK_DIR/submitted-payload"
          export MOCK_CAPTURE
          cat >"$MOCK_BIN/curl" <<'MOCK_CURL'
          #!/bin/bash
          set -euo pipefail
          config=''
          response=''
          while (($#)); do
            case "$1" in
              --config) config="$2"; shift 2 ;;
              --output) response="$2"; shift 2 ;;
              --write-out) shift 2 ;;
              *) shift ;;
            esac
          done
          payload=$(sed -n 's/^data-binary = "@\(.*\)"$/\1/p' "$config")
          cp -- "$payload" "$MOCK_CAPTURE"
          printf '{"html_url":"https://github.com/itsnin/justbuntu/issues/999"}\n' >"$response"
          printf '201'
          MOCK_CURL
          chmod 700 -- "$MOCK_BIN/curl"
          export PATH="$MOCK_BIN:$PATH"
          assert_contains <(send_failure_report "$JUSTBUNTU_LAST_REPORT_FILE" 'ghp_fixture_token') \
            'https://github.com/itsnin/justbuntu/issues/999'
          assert_contains "$MOCK_CAPTURE" 'JustBuntu installation failure'
          assert_not_contains "$MOCK_CAPTURE" 'ghp_fixture_token'
          jq empty "$MOCK_CAPTURE"

          ERROR_STATE="$CHECK_DIR/error-state"
          mkdir -p -- "$ERROR_STATE/home"
          if HOME="$ERROR_STATE/home" XDG_STATE_HOME="$ERROR_STATE/state" \
             JUSTBUNTU_INSTALL_LOG_FILE="$ERROR_STATE/state/justbuntu/install.log" \
             bash -c 'set -eEuo pipefail; source "$1/lib/logging.sh"; source "$1/lib/errors.sh"; false' \
             bash "$ROOT_DIR"; then
            fail 'noninteractive failure test unexpectedly succeeded'
          fi
          find "$ERROR_STATE/state/justbuntu/reports" -type f -name 'failure.*.txt' -print -quit |
            grep . >/dev/null || fail 'noninteractive failure did not create a report'
          printf '%s\n' 'Logging and reporting smoke checks passed.'

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify critical files retain executable permission
        run: |
          MISSING=""
          for f in bin/justbuntu bootstrap.sh; do
            if [ ! -x "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: These files must be executable but are not:$MISSING"
            exit 1
          fi
          echo "All critical files have executable permission"
      - name: Check version file exists and is non-empty
        run: |
          if [ ! -s version ]; then
            echo "ERROR: version file is missing or empty"
            exit 1
          fi
          echo "Version: $(cat version)"

      - name: Check README has MIT license link
        run: |
          if ! grep -qi "MIT" README.md; then
            echo "ERROR: README does not reference MIT license"
            exit 1
          fi
          echo "README references MIT license"

      - name: Verify LICENSE file exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file is missing"
            exit 1
          fi
          echo "LICENSE file exists"

      - name: Summary
        run: |
          echo "=== CI Summary ==="
          echo "Shell scripts: $(find . -type f -name '*.sh' -not -path './.git/*' | wc -l)"
          echo "Total files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "All checks passed"
