name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate workflow action pins and repository invariants
        run: |
          set -euo pipefail
          fail() {
            printf 'FAIL: %s\n' "$1" >&2
            exit 1
          }

          while IFS= read -r action; do
            [[ "$action" =~ ^[^@[:space:]]+@[0-9a-f]{40}$ ]] ||
              fail "workflow action is not pinned to a full commit SHA: $action"
          done < <(
            sed -n 's/^[[:space:]]*uses:[[:space:]]*//p' .github/workflows/*.yml |
              sed 's/[[:space:]]*#.*$//' | sed '/^[[:space:]]*$/d'
          )

          if find provision/general/install/terminal -type f -iname '*github*' -print -quit |
             grep -q .; then
            fail 'GitHub CLI must not have a standalone terminal installer'
          fi
          [[ ! -e tests ]] || fail 'tests directory must not be committed'
          [[ ! -e provision/general/install/terminal/general/github-cli.sh ]] ||
            fail 'GitHub CLI must be installed with essential packages'
          for required_file in \
            lib/logging/core.sh \
            lib/logging/session.sh \
            lib/logging/execution.sh \
            lib/errors/context.sh \
            lib/errors/ui.sh \
            lib/errors/traps.sh \
            lib/reporting/report-builder.sh \
            lib/reporting/github-transport.sh; do
            [[ -f "$required_file" ]] || fail "missing logging module: $required_file"
          done
          grep -Fq 'sudo -n -v </dev/tty' install.sh ||
            fail 'sudo keepalive is not bound to the controlling terminal'
          grep -Fq 'gum confirm --default=false --affirmative "Yes" --negative "No"' \
            core/desktop.sh || fail 'desktop reboot prompt is not explicit and visible'
          grep -Fq 'JUSTBUNTU_FAILURE_MENU_ACTIVE=true' lib/errors/traps.sh ||
            fail 'failure menu state is not set by the failure handler'
          grep -Fq 'Issue submission is available only after an installation failure.' \
            lib/errors/ui.sh || fail 'issue submission is not guarded to failure flow'
          grep -Eq 'sudo apt install -y .*curl.*git.*unzip.*gh|sudo apt install -y .*gh.*curl.*git.*unzip' \
            core/terminal.sh || fail 'essential package install does not include gh'
          printf '%s\n' 'Workflow pins and repository invariants passed'

      - name: Check all shell scripts pass syntax validation
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n
          echo "All shell scripts pass syntax validation"

      - name: Run ShellCheck
        run: |
          mapfile -d '' shell_files < <(
            find . -type f -name '*.sh' -not -path './.git/*' -print0
          )
          shellcheck --severity=error "${shell_files[@]}"

      - name: Run logging and reporting smoke checks
        run: |
          set -euo pipefail
          ROOT_DIR="$GITHUB_WORKSPACE"
          cd -- "$ROOT_DIR"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$CHECK_DIR"' EXIT

          fail() {
            printf 'FAIL: %s\n' "$1" >&2
            exit 1
          }

          assert_contains() {
            grep -F -- "$2" "$1" >/dev/null || fail "expected '$2' in $1"
          }

          assert_not_contains() {
            if grep -F -- "$2" "$1" >/dev/null; then
              fail "did not expect '$2' in $1"
            fi
          }

          export HOME="$CHECK_DIR/home"
          export XDG_STATE_HOME="$CHECK_DIR/state"
          export JUSTBUNTU_INSTALL_LOG_FILE="$CHECK_DIR/state/justbuntu/install.log"
          mkdir -p -- "$HOME"
          source ./lib/logging.sh
          source ./lib/reporting.sh

          start_install_log
          log_info 'token=do-not-write-this password=also-private'
          printf 'Authorization: Bearer stream-fixture\n'
          FIXTURE="$CHECK_DIR/ok.sh"
          printf '#!/bin/bash\nlog_info "fixture completed"\n' >"$FIXTURE"
          run_script "$FIXTURE"
          sleep 0.1
          finish_install_log completed

          [[ "$(stat -c '%a' "$JUSTBUNTU_INSTALL_LOG_FILE")" == '600' ]] ||
            fail 'install log is not private'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" '[REDACTED]'
          assert_not_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'do-not-write-this'
          assert_not_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'also-private'
          assert_not_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'stream-fixture'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'event=script_start'
          assert_contains "$JUSTBUNTU_INSTALL_LOG_FILE" 'event=script_complete'

          SINK_HOME="$CHECK_DIR/sink-home"
          SINK_STATE="$CHECK_DIR/sink-state"
          SINK_LOG="$SINK_STATE/justbuntu/install.log"
          SINK_OUTPUT="$CHECK_DIR/sink-output"
          HOME="$SINK_HOME" XDG_STATE_HOME="$SINK_STATE" \
            JUSTBUNTU_INSTALL_LOG_FILE="$SINK_LOG" \
            bash -c 'set -euo pipefail; source ./lib/logging.sh; start_install_log; printf "Authorization: Bearer sink-fixture\\n"; restore_tty; printf "interactive-fixture\\n"; enable_logging; printf "post-interactive-fixture\\n"; finish_install_log completed' \
            bash >"$SINK_OUTPUT" 2>&1
          assert_not_contains "$SINK_OUTPUT" 'sink-fixture'
          assert_not_contains "$SINK_LOG" 'sink-fixture'
          assert_contains "$SINK_OUTPUT" 'interactive-fixture'
          assert_contains "$SINK_OUTPUT" 'post-interactive-fixture'

          # shellcheck disable=SC2034
          JUSTBUNTU_PHASE='test'
          # shellcheck disable=SC2034
          CURRENT_SCRIPT_PATH="$FIXTURE"
          # shellcheck disable=SC2034
          JUSTBUNTU_ERROR_FUNCTION='test_failure'
          # shellcheck disable=SC2034
          JUSTBUNTU_ERROR_LINE='42'
          # shellcheck disable=SC2034
          JUSTBUNTU_ERROR_CODE='1'
          # shellcheck disable=SC2034
          JUSTBUNTU_ERROR_COMMAND='curl Authorization: Bearer do-not-write-this'
          create_failure_report
          [[ "$(stat -c '%a' "$JUSTBUNTU_LAST_REPORT_FILE")" == '600' ]] ||
            fail 'failure report is not private'
          assert_contains "$JUSTBUNTU_LAST_REPORT_FILE" 'JustBuntu installation failure'
          assert_contains "$JUSTBUNTU_LAST_REPORT_FILE" '[REDACTED]'
          assert_not_contains "$JUSTBUNTU_LAST_REPORT_FILE" 'do-not-write-this'

          if send_failure_report "$JUSTBUNTU_LAST_REPORT_FILE" ''; then
            fail 'empty token unexpectedly submitted a report'
          elif [[ "$?" != '3' ]]; then
            fail 'empty token did not use the local-report fallback'
          fi

          MOCK_BIN="$CHECK_DIR/bin"
          mkdir -p -- "$MOCK_BIN"
          MOCK_CAPTURE="$CHECK_DIR/submitted-payload"
          export MOCK_CAPTURE
          cat >"$MOCK_BIN/curl" <<'MOCK_CURL'
          #!/bin/bash
          set -euo pipefail
          config=''
          response=''
          while (($#)); do
            case "$1" in
              --config) config="$2"; shift 2 ;;
              --output) response="$2"; shift 2 ;;
              --write-out) shift 2 ;;
              *) shift ;;
            esac
          done
          payload=$(sed -n 's/^data-binary = "@\(.*\)"$/\1/p' "$config")
          cp -- "$payload" "$MOCK_CAPTURE"
          printf '{"html_url":"https://github.com/itsnin/justbuntu/issues/999"}\n' >"$response"
          printf '201'
          MOCK_CURL
          chmod 700 -- "$MOCK_BIN/curl"
          export PATH="$MOCK_BIN:$PATH"
          assert_contains <(send_failure_report "$JUSTBUNTU_LAST_REPORT_FILE" 'ghp_fixture_token') \
            'https://github.com/itsnin/justbuntu/issues/999'
          assert_contains "$MOCK_CAPTURE" 'JustBuntu installation failure'
          assert_not_contains "$MOCK_CAPTURE" 'ghp_fixture_token'
          jq empty "$MOCK_CAPTURE"

          SOURCE_FAILURE="$CHECK_DIR/source-failure.sh"
          printf '#!/bin/bash\nfalse\n' >"$SOURCE_FAILURE"
          SOURCE_DRIVER="$CHECK_DIR/source-driver.sh"
          printf "#!/bin/bash\nset -eEuo pipefail\nsource ./lib/logging.sh\nsource ./lib/errors.sh\nrun_script \"\$1\"\n" >"$SOURCE_DRIVER"
          SOURCE_ERROR_STATE="$CHECK_DIR/source-error-state"
          mkdir -p -- "$SOURCE_ERROR_STATE/home"
          if HOME="$SOURCE_ERROR_STATE/home" XDG_STATE_HOME="$SOURCE_ERROR_STATE/state" \
             JUSTBUNTU_INSTALL_LOG_FILE="$SOURCE_ERROR_STATE/state/justbuntu/install.log" \
             bash "$SOURCE_DRIVER" "$SOURCE_FAILURE"; then
            fail 'sourced failure test unexpectedly succeeded'
          fi
          SOURCE_REPORT=$(find "$SOURCE_ERROR_STATE/state/justbuntu/reports" -type f -name 'failure.*.txt' -print -quit)
          [[ -n "$SOURCE_REPORT" ]] || fail 'sourced failure did not create a report'
          assert_contains "$SOURCE_REPORT" "- Failed command: \`false\`"
          assert_contains "$SOURCE_REPORT" "$SOURCE_FAILURE"

          ERROR_STATE="$CHECK_DIR/error-state"
          mkdir -p -- "$ERROR_STATE/home"
          if HOME="$ERROR_STATE/home" XDG_STATE_HOME="$ERROR_STATE/state" \
             JUSTBUNTU_INSTALL_LOG_FILE="$ERROR_STATE/state/justbuntu/install.log" \
             bash -c 'set -eEuo pipefail; source ./lib/logging.sh; source ./lib/errors.sh; false' \
             bash; then
            fail 'noninteractive failure test unexpectedly succeeded'
          fi
          ERROR_REPORT=$(find "$ERROR_STATE/state/justbuntu/reports" -type f -name 'failure.*.txt' -print -quit)
          [[ -n "$ERROR_REPORT" ]] || fail 'noninteractive failure did not create a report'
          assert_contains "$ERROR_REPORT" 'Error ID:'
          assert_contains "$ERROR_REPORT" '### Call path'

          GIT_CONFIG_GLOBAL="$CHECK_DIR/gitconfig"
          export GIT_CONFIG_GLOBAL
          JUSTBUNTU_GIT_USER_NAME='CI User'
          JUSTBUNTU_GIT_USER_EMAIL='ci@example.invalid'
          JUSTBUNTU_GIT_CREDENTIAL_USERNAME='ci-user'
          JUSTBUNTU_GIT_CREDENTIAL_SECRET='ci-token'
          export JUSTBUNTU_GIT_USER_NAME JUSTBUNTU_GIT_USER_EMAIL \
            JUSTBUNTU_GIT_CREDENTIAL_USERNAME JUSTBUNTU_GIT_CREDENTIAL_SECRET
          GIT_HELPER_RECORD="$CHECK_DIR/git-credentials"
          export GIT_HELPER_RECORD
          GIT_CREDENTIAL_HELPER="$CHECK_DIR/git-credential-helper"
          cat >"$GIT_CREDENTIAL_HELPER" <<'GIT_HELPER'
          #!/bin/bash
          set -euo pipefail
          case "${1:-}" in
            get|store)
              if [[ "$1" == 'store' ]]; then
                cat >"$GIT_HELPER_RECORD"
              elif [[ -f "$GIT_HELPER_RECORD" ]]; then
                cat -- "$GIT_HELPER_RECORD"
              fi
              ;;
            erase)
              rm -f -- "$GIT_HELPER_RECORD"
              ;;
          esac
          GIT_HELPER
          chmod 700 -- "$GIT_CREDENTIAL_HELPER"
          git config --global credential.helper "!$GIT_CREDENTIAL_HELPER"
          source ./provision/general/configure/git.sh
          [[ "$(git config --global user.name)" == 'CI User' ]] ||
            fail 'Git name was not configured'
          [[ "$(git config --global user.email)" == 'ci@example.invalid' ]] ||
            fail 'Git email was not configured'
          CREDENTIALS=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill)
          assert_contains <(printf '%s\n' "$CREDENTIALS") 'username=ci-user'
          assert_contains <(printf '%s\n' "$CREDENTIALS") 'password=ci-token'
          printf 'protocol=https\nhost=github.com\n\n' | git credential reject
          unset JUSTBUNTU_GIT_USER_NAME JUSTBUNTU_GIT_USER_EMAIL \
            JUSTBUNTU_GIT_CREDENTIAL_USERNAME JUSTBUNTU_GIT_CREDENTIAL_SECRET
          printf '%s\n' 'Logging and reporting smoke checks passed.'

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify critical files retain executable permission
        run: |
          MISSING=""
          for f in bin/justbuntu bootstrap.sh; do
            if [ ! -x "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: These files must be executable but are not:$MISSING"
            exit 1
          fi
          echo "All critical files have executable permission"
      - name: Check version file exists and is non-empty
        run: |
          if [ ! -s version ]; then
            echo "ERROR: version file is missing or empty"
            exit 1
          fi
          echo "Version: $(cat version)"

      - name: Check README has MIT license link
        run: |
          if ! grep -qi "MIT" README.md; then
            echo "ERROR: README does not reference MIT license"
            exit 1
          fi
          echo "README references MIT license"

      - name: Verify LICENSE file exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file is missing"
            exit 1
          fi
          echo "LICENSE file exists"

      - name: Summary
        run: |
          echo "=== CI Summary ==="
          echo "Shell scripts: $(find . -type f -name '*.sh' -not -path './.git/*' | wc -l)"
          echo "Total files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "All checks passed"
