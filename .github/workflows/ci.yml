name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check all shell scripts pass syntax validation
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n
          echo "All shell scripts pass syntax validation"

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error \
            $(find . -type f -name '*.sh' -not -path './.git/*' -print)

      - name: Run focused installer tests
        run: bash tests/run.sh

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify critical files retain executable permission
        run: |
          MISSING=""
          for f in bin/justbuntu bootstrap.sh; do
            if [ ! -x "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: These files must be executable but are not:$MISSING"
            exit 1
          fi
          echo "All critical files have executable permission"
      - name: Check version file exists and is non-empty
        run: |
          if [ ! -s version ]; then
            echo "ERROR: version file is missing or empty"
            exit 1
          fi
          echo "Version: $(cat version)"

      - name: Check README has MIT license link
        run: |
          if ! grep -qi "MIT" README.md; then
            echo "ERROR: README does not reference MIT license"
            exit 1
          fi
          echo "README references MIT license"

      - name: Verify LICENSE file exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file is missing"
            exit 1
          fi
          echo "LICENSE file exists"

      - name: Summary
        run: |
          echo "=== CI Summary ==="
          echo "Shell scripts: $(find . -type f -name '*.sh' -not -path './.git/*' | wc -l)"
          echo "Total files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "All checks passed"
