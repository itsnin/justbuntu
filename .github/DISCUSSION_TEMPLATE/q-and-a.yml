title: "[Q&A] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking a question! Please provide as much context as possible.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
      placeholder: I'm wondering how...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Ubuntu version, architecture, relevant setup details
      placeholder: Ubuntu 26.04 LTS, x86_64, GNOME...
