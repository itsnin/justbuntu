version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # group ALL github actions updates into a single PR/branch
    # prevents dependabot from creating one branch per action
    groups:
      all-github-actions:
        patterns:
          - "*"
