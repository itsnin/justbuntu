provisioning:
  - changed-files:
      - any-glob-to-any-file:
          - install.sh
          - core/terminal.sh
          - core/desktop.sh
          - lib/**
          - bootstrap.sh
core:
  - changed-files:
      - any-glob-to-any-file:
          - core/**
terminal tools:
  - changed-files:
      - any-glob-to-any-file:
          - provision/install/terminal/**
          - provision/install/prerequisites/**
          - provision/configure/git.sh
          - provision/configure/shell-profile.sh
desktop tools:
  - changed-files:
      - any-glob-to-any-file:
          - provision/configure/gnome/**
          - provision/install/gnome/**
extensions:
  - changed-files:
      - any-glob-to-any-file:
          - provision/install/gnome/extensions/**
apps:
  - changed-files:
      - any-glob-to-any-file:
          - provision/install/apps/**
shared assets:
  - changed-files:
      - any-glob-to-any-file:
          - share/**
shell configuration:
  - changed-files:
      - any-glob-to-any-file:
          - shell/**
          - config/**
cli management:
  - changed-files:
      - any-glob-to-any-file:
          - bin/**
revert:
  - changed-files:
      - any-glob-to-any-file:
          - revert/**
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
github config:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
