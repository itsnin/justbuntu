name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out all required fields.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the issue
      placeholder: |
        1. Run bootstrap.sh
        2. Select these options...
        3. See error
    validations:
      required: true
  - type: input
    id: ubuntu-version
    attributes:
      label: Ubuntu version
      placeholder: "26.04 LTS"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - Other (please describe)
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop environment
      options:
        - GNOME (default)
        - No desktop / terminal only
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Check /var/log/justbuntu-install.log
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues
          required: true
        - label: I am running on a supported Ubuntu version (26.04 LTS+)
          required: true
